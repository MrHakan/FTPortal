name: Build and Release All FTPortal Editions

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared dashboard, lobby, and browser contracts
        run: node --test WEB/tests/portal.test.mjs

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run PowerShell tests
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\POWERSHELL\tests\Run-Tests.ps1
          powershell -ExecutionPolicy Bypass -File .\POWERSHELL\tests\Run-IsolationTests.ps1
      - name: Package PowerShell edition
        shell: powershell
        run: Compress-Archive -Path .\POWERSHELL\* -DestinationPath .\FTPortal-PowerShell.zip -Force
      - uses: actions/upload-artifact@v7
        with:
          name: powershell
          path: FTPortal-PowerShell.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p ANDROID :app:assembleRelease --stacktrace
      - name: Check bundled browser page
        run: unzip -l ANDROID/app/build/outputs/apk/release/app-release.apk | grep -F 'assets/portal.html'
      - name: Name APK
        run: cp ANDROID/app/build/outputs/apk/release/app-release.apk FTPortal-Android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: FTPortal-Android.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: IOS
        run: xcodegen generate
      - name: Build unsigned device app
        working-directory: IOS
        run: xcodebuild -project FTPortal.xcodeproj -scheme FTPortal -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Check bundled browser page
        working-directory: IOS
        run: test -f build/Build/Products/Release-iphoneos/FTPortal.app/portal.html
      - name: Package unsigned IPA
        working-directory: IOS
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "$GITHUB_WORKSPACE/FTPortal-iOS-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: FTPortal-iOS-unsigned.ipa
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows x64
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish .\WINDOWS\FTPortal.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\WINDOWS\publish
          Compress-Archive -Path .\WINDOWS\publish\* -DestinationPath .\FTPortal-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: FTPortal-Windows-x64.zip
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: [powershell, android, ios, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify collective release assets
        run: |
          test -f release-assets/FTPortal-PowerShell.zip
          test -f release-assets/FTPortal-Android.apk
          test -f release-assets/FTPortal-iOS-unsigned.ipa
          test -f release-assets/FTPortal-Windows-x64.zip
      - name: Publish collective release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          set -euo pipefail
          TITLE="FTPortal Multi-Platform ${TAG_NAME}"
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --generate-notes
          fi
