name: FTPortal
options:
  bundleIdPrefix: com.mrhakan
  deploymentTarget:
    iOS: "16.0"
targets:
  FTPortal:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrhakan.ftportal
        PRODUCT_NAME: FTPortal
        MARKETING_VERSION: 4.1.0
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: FTPortal
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: FTPortal discovers nearby FTPortal lobbies and transfers files directly on your local network.
        NSBonjourServices:
          - _http._tcp.
          - _ftportal._tcp.
